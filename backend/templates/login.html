<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>scan2order: sign in</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 380px; }

        .logo { text-align: center; margin-bottom: 36px; }
        .logo h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #4ecdc4, #2db5ad);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p { color: #556; font-size: 13px; margin-top: 4px; }

        .card {
            background: #111122;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 28px 24px;
        }

        .step-label {
            font-size: 13px;
            color: #4ecdc4;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .step-title {
            font-size: 18px;
            font-weight: 700;
            color: #eee;
            margin-bottom: 6px;
        }
        .step-sub {
            font-size: 13px;
            color: #667;
            margin-bottom: 22px;
            line-height: 1.5;
        }
        .step-sub span { color: #4ecdc4; }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Phone input with +91 prefix */
        .phone-wrap {
            display: flex;
            background: #0a0a1a;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.15s;
        }
        .phone-wrap:focus-within { border-color: #4ecdc4; }
        .phone-prefix {
            padding: 12px 12px 12px 14px;
            color: #4ecdc4;
            font-size: 15px;
            font-weight: 600;
            background: transparent;
            border-right: 1px solid #222;
            white-space: nowrap;
            user-select: none;
        }
        .phone-wrap input {
            flex: 1;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: #eee;
            font-size: 16px;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .phone-wrap input:focus { outline: none; }
        .phone-wrap input::placeholder { color: #444; letter-spacing: 0; }

        /* OTP code input */
        .otp-input {
            width: 100%;
            padding: 14px;
            background: #0a0a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #eee;
            font-size: 28px;
            font-weight: 700;
            font-family: 'SF Mono', 'Fira Code', monospace;
            letter-spacing: 10px;
            text-align: center;
            transition: border-color 0.15s;
        }
        .otp-input:focus { outline: none; border-color: #4ecdc4; }
        .otp-input::placeholder { font-size: 18px; letter-spacing: 4px; color: #333; }

        .btn-primary {
            width: 100%;
            padding: 14px;
            margin-top: 4px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #4ecdc4, #2db5ad);
            color: #001;
            transition: opacity 0.15s;
            font-family: inherit;
        }
        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

        .btn-ghost {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: #778;
            transition: color 0.15s, border-color 0.15s;
            font-family: inherit;
        }
        .btn-ghost:hover:not(:disabled) { color: #aaa; border-color: #444; }
        .btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }

        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: #1a0808;
            border-left: 3px solid #e24b4a;
            border-radius: 6px;
            font-size: 13px;
            color: #e24b4a;
        }
        .error-msg.visible { display: block; }

        .countdown {
            text-align: center;
            font-size: 12px;
            color: #556;
            margin-top: 14px;
        }
        .countdown span { color: #4ecdc4; font-weight: 600; }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>scan2order</h1>
        <p>grocery price comparison across BigBasket, Blinkit &amp; Zepto</p>
    </div>

    <div class="card">

        <!-- Step 1: phone number -->
        <div id="step-phone">
            <div class="step-label">Step 1 of 2</div>
            <div class="step-title">Enter your phone</div>
            <div class="step-sub">We'll send a one-time code via SMS.</div>

            <div class="field">
                <label for="phone-input">Phone number</label>
                <div class="phone-wrap">
                    <span class="phone-prefix">+91</span>
                    <input type="tel" id="phone-input"
                           placeholder="98765 43210"
                           maxlength="10"
                           inputmode="numeric"
                           autocomplete="tel-national">
                </div>
            </div>

            <button class="btn-primary" id="send-btn" onclick="handleSendOtp()">
                Send code
            </button>
            <div class="error-msg" id="phone-error"></div>
        </div>

        <!-- Step 2: OTP code -->
        <div id="step-otp" class="hidden">
            <div class="step-label">Step 2 of 2</div>
            <div class="step-title">Enter the code</div>
            <div class="step-sub" id="otp-sub">
                Sent to <span id="otp-phone-display"></span>
            </div>

            <div class="field">
                <label for="otp-input">6-digit code</label>
                <input type="text" id="otp-input" class="otp-input"
                       placeholder="——————"
                       maxlength="6"
                       inputmode="numeric"
                       autocomplete="one-time-code">
            </div>

            <button class="btn-primary" id="verify-btn" onclick="handleVerifyOtp()">
                Verify
            </button>
            <button class="btn-ghost" id="resend-btn" disabled onclick="handleResend()">
                Resend code
            </button>
            <div class="error-msg" id="otp-error"></div>
            <div class="countdown" id="countdown-wrap">
                Resend available in <span id="countdown-sec">60</span>s
            </div>
        </div>

    </div>
</div>

<script>
let _phone = '';        // normalised E.164 phone
let _resendTimer = null;

// ── Helpers ───────────────────────────────────────────────────────────────────

function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('visible');
}

function hideError(id) {
    document.getElementById(id).classList.remove('visible');
}

function normalisePhone(raw) {
    // Accept 10-digit Indian numbers (with or without leading 0)
    const digits = raw.replace(/\D/g, '');
    if (digits.length === 10 && /^[6-9]/.test(digits)) return '+91' + digits;
    if (digits.length === 11 && digits.startsWith('0')) {
        const d = digits.slice(1);
        if (/^[6-9]/.test(d)) return '+91' + d;
    }
    if (digits.length === 12 && digits.startsWith('91')) return '+' + digits;
    return null;
}

// ── Step 1: send OTP ──────────────────────────────────────────────────────────

async function handleSendOtp() {
    hideError('phone-error');
    const raw = document.getElementById('phone-input').value.trim();
    const phone = normalisePhone(raw);
    if (!phone) {
        showError('phone-error', 'Enter a valid 10-digit Indian mobile number.');
        return;
    }
    _phone = phone;

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
        const resp = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone }),
        });
        const data = await resp.json();
        if (!data.success) {
            showError('phone-error', data.error || 'Failed to send code.');
            return;
        }
        showStep2(phone);
    } catch {
        showError('phone-error', 'Network error. Please try again.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Send code';
    }
}

function showStep2(phone) {
    document.getElementById('step-phone').classList.add('hidden');
    document.getElementById('step-otp').classList.remove('hidden');

    // Display the phone number in the subtitle
    const display = phone.replace('+91', '+91 ').replace(/(\d{5})(\d{5})$/, '$1 $2');
    document.getElementById('otp-phone-display').textContent = display;

    document.getElementById('otp-input').focus();
    startResendTimer();
}

// ── Step 2: verify OTP ────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
    // Auto-submit when 6 digits are entered
    document.getElementById('otp-input').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        if (e.target.value.length === 6) handleVerifyOtp();
    });
    document.getElementById('phone-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSendOtp();
    });
    document.getElementById('phone-input').addEventListener('input', (e) => {
        // Only allow digits
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
    });
});

async function handleVerifyOtp() {
    hideError('otp-error');
    const code = document.getElementById('otp-input').value.trim();
    if (code.length !== 6) {
        showError('otp-error', 'Enter the 6-digit code from your SMS.');
        return;
    }

    const btn = document.getElementById('verify-btn');
    btn.disabled = true;
    btn.textContent = 'Verifying…';

    try {
        const resp = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: _phone, code }),
        });
        const data = await resp.json();
        if (!data.success) {
            showError('otp-error', data.error || 'Invalid code. Please try again.');
            document.getElementById('otp-input').value = '';
            document.getElementById('otp-input').focus();
            return;
        }
        window.location.href = '/';
    } catch {
        showError('otp-error', 'Network error. Please try again.');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Verify';
    }
}

// ── Resend countdown ──────────────────────────────────────────────────────────

function startResendTimer() {
    const resendBtn = document.getElementById('resend-btn');
    const countdownSec = document.getElementById('countdown-sec');
    const countdownWrap = document.getElementById('countdown-wrap');

    resendBtn.disabled = true;
    countdownWrap.style.display = '';
    let secs = 60;
    countdownSec.textContent = secs;

    if (_resendTimer) clearInterval(_resendTimer);
    _resendTimer = setInterval(() => {
        secs--;
        countdownSec.textContent = secs;
        if (secs <= 0) {
            clearInterval(_resendTimer);
            resendBtn.disabled = false;
            countdownWrap.style.display = 'none';
        }
    }, 1000);
}

async function handleResend() {
    hideError('otp-error');
    document.getElementById('otp-input').value = '';

    const btn = document.getElementById('resend-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
        const resp = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: _phone }),
        });
        const data = await resp.json();
        if (!data.success) {
            showError('otp-error', data.error || 'Failed to resend code.');
            btn.disabled = false;
        } else {
            startResendTimer();
        }
    } catch {
        showError('otp-error', 'Network error. Please try again.');
        btn.disabled = false;
    } finally {
        btn.textContent = 'Resend code';
    }
}
</script>
</body>
</html>
