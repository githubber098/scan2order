<!DOCTYPE html>
<html lang="en" data-theme="fresh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>scan2order · Sign in</title>
<link rel="stylesheet" href="/static/theme.css" />
<script defer src="/static/app.js"></script>
<style>
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:400px; }
  .auroraglow{ position:fixed; border-radius:50%; filter:blur(60px); opacity:.5; pointer-events:none; z-index:0; }
</style>
</head>
<body data-page="login">
  <div class="auroraglow" style="width:300px;height:300px;top:-80px;left:-60px;background:var(--accent)"></div>
  <div class="login-wrap">
    <div class="login-card" style="position:relative;z-index:1">
      <div class="center" style="margin-bottom:24px">
        <div class="wm lg" style="margin:0 auto">scan2order</div>
        <div class="tag">grocery price comparison · BigBasket, Blinkit &amp; Zepto</div>
      </div>

      <div class="card" style="padding:22px">
        <!-- step 1: contact -->
        <div id="step-contact">
          <div class="seg" style="margin-bottom:20px">
            <button class="on" id="tab-phone" onclick="selectMethod('phone')"><span class="row" style="gap:6px;justify-content:center"><i data-ico="phone" data-s="15"></i>Phone</span></button>
            <button id="tab-email" onclick="selectMethod('email')"><span class="row" style="gap:6px;justify-content:center"><i data-ico="mail" data-s="15"></i>Email</span></button>
          </div>
          <h1 class="h2" style="margin-bottom:4px">Sign in or sign up</h1>
          <p class="lead" style="margin-bottom:18px">We'll send you a one-time code.</p>

          <div id="field-phone">
            <label class="label">Phone number</label>
            <div class="row" style="gap:0;border:1px solid var(--card-br);border-radius:var(--radius-sm);overflow:hidden;background:var(--input-bg)">
              <span style="padding:13px 12px;color:var(--accent2);font-weight:700;border-right:1px solid var(--card-br)">+91</span>
              <input class="input" id="input-phone" type="tel" inputmode="numeric" placeholder="98765 43210" style="border:none;border-radius:0;letter-spacing:.5px" />
            </div>
          </div>

          <div id="field-email" style="display:none">
            <label class="label">Email address</label>
            <input class="input" id="input-email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email" />
          </div>

          <div id="login-msg1" class="dim" style="font-size:12.5px;margin-top:8px;min-height:1em"></div>
          <button class="btn" style="margin-top:12px" onclick="sendCode()">Send code</button>
        </div>

        <!-- step 2: code -->
        <div id="step-code" style="display:none">
          <button onclick="backToContact()" style="background:none;border:none;color:var(--muted);font-size:13px;padding:0;margin-bottom:16px;cursor:pointer" class="row">
            <span style="display:inline-flex;transform:scaleX(-1)"><i data-ico="chevron" data-s="15"></i></span>Back
          </button>
          <h1 class="h1" style="margin-bottom:6px">Enter the code</h1>
          <p class="lead" style="margin-bottom:20px">Sent to <span class="num" id="sent-to" style="color:var(--accent2);font-weight:600"></span></p>
          <input class="input" id="input-code" type="number" inputmode="numeric" placeholder="000000" maxlength="6" style="font-size:22px;letter-spacing:4px;text-align:center" />
          <div id="login-msg2" class="dim" style="font-size:12.5px;margin-top:8px;min-height:1em"></div>
          <button class="btn" style="margin-top:12px" onclick="verifyCode()">Verify</button>
          <div class="center muted" id="resend-row" style="margin-top:14px;font-size:12.5px;display:none">
            <button onclick="sendCode(true)" style="background:none;border:none;color:var(--accent2);cursor:pointer;font-size:12.5px">Resend code</button>
          </div>
        </div>
      </div>

      <p class="center dim" style="font-size:11.5px;margin-top:18px">By continuing you agree to our Terms &amp; Privacy</p>
    </div>
  </div>

  <script>
    let _channel = 'phone';

    function selectMethod(m) {
      _channel = m;
      const phone = m === 'phone';
      document.getElementById('tab-phone').classList.toggle('on', phone);
      document.getElementById('tab-email').classList.toggle('on', !phone);
      document.getElementById('field-phone').style.display = phone ? '' : 'none';
      document.getElementById('field-email').style.display = phone ? 'none' : '';
    }

    function _getValue() {
      if (_channel === 'phone') {
        const raw = document.getElementById('input-phone').value.replace(/\D/g,'');
        if (raw.length === 10 && /^[6-9]/.test(raw)) return '+91' + raw;
        if (raw.length === 12 && raw.startsWith('91')) return '+' + raw;
        return null;
      }
      const v = document.getElementById('input-email').value.trim();
      return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) ? v : null;
    }

    function backToContact() {
      document.getElementById('step-code').style.display = 'none';
      document.getElementById('step-contact').style.display = '';
    }

    async function sendCode(resend) {
      const val = _getValue();
      const msg = document.getElementById('login-msg1');
      if (!val) { msg.textContent = _channel==='phone' ? 'Enter a valid 10-digit Indian phone number.' : 'Enter a valid email address.'; return; }
      msg.textContent = 'Sending…';
      try {
        const r = await fetch('/api/auth/send-otp', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ channel: _channel, value: val }),
        });
        const d = await r.json();
        if (d.error) { msg.textContent = d.error; return; }
        document.getElementById('sent-to').textContent = val;
        document.getElementById('step-contact').style.display = 'none';
        document.getElementById('step-code').style.display = '';
        document.getElementById('login-msg2').textContent = resend ? 'New code sent.' : '';
        document.getElementById('input-code').value = '';
        document.getElementById('input-code').focus();
        setTimeout(() => { document.getElementById('resend-row').style.display=''; }, 20000);
      } catch(e) { msg.textContent = 'Error: ' + e.message; }
    }

    async function verifyCode() {
      const val = _getValue();
      const code = document.getElementById('input-code').value.trim();
      const msg = document.getElementById('login-msg2');
      if (!code || code.length < 4) { msg.textContent = 'Enter the 6-digit code.'; return; }
      msg.textContent = 'Verifying…';
      try {
        const r = await fetch('/api/auth/verify-otp', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ channel: _channel, value: val, code }),
        });
        const d = await r.json();
        if (d.error) { msg.textContent = d.error; return; }
        window.location.href = d.redirect || '/';
      } catch(e) { msg.textContent = 'Error: ' + e.message; }
    }
  </script>
</body>
</html>
