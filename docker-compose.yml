services:
  scan2order:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # One multimodal model serves BOTH OCR (handwriting) and the ranking
      # fallback. qwen2.5vl:3b is OCR-specialised and ~3GB (lighter + faster on
      # a CPU-only box than gemma4:e2b, which needed 1100px+ to read handwriting
      # and ran ~40-60s). Pull it once:  docker compose exec ollama ollama pull qwen2.5vl:3b
      - OLLAMA_MODEL=qwen2.5vl:3b
      # OCR backend: auto (VLM first, Tesseract fallback) | ollama | tesseract
      - OCR_BACKEND=auto
      # Optional: shrink the image fed to the VLM. qwen2.5vl reads handwriting
      # at lower res than gemma4 did, so try 900 for ~2x speed; raise if reads fail.
      # - OCR_MAX_DIM=900
      # ── Auth ───────────────────────────────────────────────────────────────
      # REQUIRED: sign session cookies.  Generate with:
      #   python3 -c "import secrets; print(secrets.token_hex(32))"
      # Without this, all users are logged out on every container restart.
      # - SECRET_KEY=your-64-char-hex-string-here
      # ── Storage backend ────────────────────────────────────────────────────
      # SQLite is the default (no env var needed).  To switch to MySQL,
      # uncomment the line below and make sure the 'mysql' service is running.
      # The data/ volume mount can be removed once MySQL is active.
      #
      # - MYSQL_URL=mysql://scan2order:changeme@mysql:3306/scan2order
    mem_limit: 512m
    volumes:
      - ./data:/app/data      # SQLite sessions.db lives here; safe to keep even with MySQL
    depends_on:
      - ollama
      # Uncomment when switching to MySQL:
      # - mysql

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # No mem_limit on purpose. Under a cgroup memory limit, Linux counts page
    # cache against the limit, so Ollama under-reported available RAM and refused
    # to load the model even with GiBs free on the host. Letting Ollama see host
    # memory (16GB box) fixes it; qwen2.5vl:3b (~3GB) is size-bounded. Add
    # `mem_limit: 13g` only if you later run a much bigger model.
    volumes:
      - ollama_data:/root/.ollama
    # NOTE: the model is NOT auto-pulled. After first `docker compose up`, run:
    #   docker compose exec ollama ollama pull qwen2.5vl:3b
    # (You can `ollama rm gemma4:e2b` afterwards to reclaim ~7GB of disk.)

  # ── MySQL (opt-in) ──────────────────────────────────────────────────────────
  # Uncomment this entire block AND the MYSQL_URL line above to use MySQL
  # instead of SQLite.  The data is persisted in the 'mysql_data' volume so
  # it survives container restarts and image rebuilds.
  #
  # mysql:
  #   image: mysql:8.0
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: scan2order
  #     MYSQL_USER: scan2order
  #     MYSQL_PASSWORD: changeme
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "scan2order", "-pchangeme"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  ollama_data:
  # mysql_data:   # uncomment together with the mysql service above
