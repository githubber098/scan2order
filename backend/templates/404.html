<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — scan2order</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
        }

        /* Subtle radial glow behind the 404 */
        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            width: 520px;
            height: 520px;
            background: radial-gradient(ellipse, rgba(78,205,196,0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
        }

        /* Logo */
        .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #4ecdc4, #2db5ad);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.4px;
            margin-bottom: 48px;
        }


        /* Big 404 */
        .code {
            font-size: clamp(96px, 24vw, 148px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -6px;
            background: linear-gradient(135deg, #4ecdc4 0%, #2db5ad 55%, #1a7a76 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 48px rgba(78,205,196,0.2));
            margin-bottom: 8px;
            user-select: none;
        }

        /* Thin teal rule */
        .rule {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4ecdc4, transparent);
            border-radius: 2px;
            margin: 0 auto 24px;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }

        .sub {
            font-size: 14px;
            color: #667;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* Pill badge showing the bad path */
        .path-badge {
            display: inline-block;
            background: #111122;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 12px;
            color: #e24b4a;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            letter-spacing: 0.3px;
            margin-bottom: 32px;
            word-break: break-all;
        }

        .btn {
            display: inline-block;
            padding: 13px 30px;
            background: linear-gradient(135deg, #4ecdc4, #2db5ad);
            color: #001a19;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: opacity 0.15s, transform 0.15s;
            letter-spacing: -0.1px;
        }
        .btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }
        .btn:active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo">scan2order</div>
    <div class="code">404</div>
    <div class="rule"></div>
    <div class="title">Page not found</div>
    <div class="sub">Looks like this page went out of stock.</div>
    <div class="path-badge" id="path-badge"></div>
    <br>
    <a href="/" class="btn">← Go home</a>
</div>
<script>
    // Show the path that triggered the 404
    const badge = document.getElementById('path-badge');
    const p = window.location.pathname + window.location.search;
    badge.textContent = p.length > 60 ? p.slice(0, 57) + '…' : p;
</script>
</body>
</html>
