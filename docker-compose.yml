services:
  scan2order:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
    mem_limit: 512m
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 6g
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
